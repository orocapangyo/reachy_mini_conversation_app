# 한국어 데스크 동반자 기억 검색 벤치마크 데이터셋 v1.
# 사실 30개(카테고리 6종 × 5개)와 질의 41개. 태그로 약점을 나눠 본다.
#   exact      사실 문장의 일부를 그대로 검색
#   short_word 1~2글자 한국어 단어 (GBrain 키워드 모드는 3글자 미만 단어를 버린다)
#   multi_word 사실에 모두 들어 있는 여러 단어
#   paraphrase 같은 뜻, 다른 단어 (임베딩 없이는 찾기 어렵다)
#   english    영어 질의
#   persona / promise  Reachy 쪽 사실
#   negative   정답이 없는 질의 (결과가 나오면 오탐)
schema_version = 1
title = "한국어 데스크 동반자 기억 v1"

